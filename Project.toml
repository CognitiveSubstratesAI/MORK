name = "MORK"
uuid = "162375cb-4023-4ef9-895b-22c0041d5c13"
version = "0.1.0"
authors = ["PRIMUS Team"]

[deps]
Base64 = "2a0f44e3-6c83-55bd-87e4-b1978d98bd5f"
PathMaps = "a8b3d4e5-f012-4567-89ab-cdef01234567"
PrecompileTools = "aea7be01-6a6a-4083-8856-8a6e6704d82a"

[sources]
# Dev-link to the sibling PathMap checkout. CI clones CognitiveSubstratesAI/PathMap
# next to this repo before instantiation (mirrors NGCLearn ↔ NGCSimLib).
PathMaps = {path = "../PathMap"}

[compat]
Base64 = "1.11"
PathMaps = "0.3"
PrecompileTools = "1.3.3"
PropCheck = "0.10.1"
Zlib_jll = "1.3.1"
julia = "1.12"

# ⚠️ DEV/ANALYSIS TOOLS ARE NOT DECLARED HERE — they come from the GLOBAL env (@v1.12).
# Verified 2026-08-20: `julia --project=.` has LOAD_PATH ["@", "@v#.#", "@stdlib"], so JET, Aqua,
# BenchmarkTools, AllocCheck, Cthulhu, Debugger and Revise all resolve from the global env, and
# `tools/run_tests.sh` invokes julia that way rather than through `Pkg.test`.
# WHY THEY WERE REMOVED rather than updated: the [compat] bounds here read Aqua = "0.8.15" and
# JET = "0.11.3" while the global env supplied Aqua 1.0.0-DEV and JET 0.12.1. Bounds that constrain
# nothing and name versions nobody loads are worse than absent — they read as a contract.
# ⚠️ THE TRADE, STATED: `Pkg.test(MORK)` builds an ISOLATED env with no global LOAD_PATH entry, so it
# would no longer find these. Nothing in this tree calls it (checked). A clean-room CI must either
# provision the global env or restore these entries.
[extras]
PropCheck = "ca382230-33be-11e9-0059-d981d03070e4"
SHA = "ea8e919c-243c-51af-8825-aaa63cd721ce"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"
Zlib_jll = "83775a58-1f1d-513f-b197-d71354ab007a"

[targets]
test = ["Test"]
