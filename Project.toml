name = "MORK"
uuid = "162375cb-4023-4ef9-895b-22c0041d5c13"
version = "0.1.0"
authors = ["PRIMUS Team"]

[deps]
Base64 = "2a0f44e3-6c83-55bd-87e4-b1978d98bd5f"
PathMaps = "a8b3d4e5-f012-4567-89ab-cdef01234567"
PrecompileTools = "aea7be01-6a6a-4083-8856-8a6e6704d82a"

[sources]
# Dev-link to the sibling PathMap checkout. CI clones CognitiveSubstratesAI/PathMap
# next to this repo before instantiation (mirrors NGCLearn ↔ NGCSimLib).
PathMaps = {path = "../PathMap"}

[compat]
Base64 = "1.11"
JET = "0.12"
PathMaps = "0.4"
PrecompileTools = "1.3.3"
Printf = "1.11"
PropCheck = "0.10.1"
Random = "1.11"
Zlib_jll = "1.3.1"
julia = "1.12"

# ⚠️ TEST-ONLY DEPS MUST BE DECLARED HERE — `Pkg.test` DOES run in this tree now.
# The note this replaces said dev/analysis tools come from the GLOBAL env (@v1.12), because
# `julia --project=.` has LOAD_PATH ["@", "@v#.#", "@stdlib"] and `tools/run_tests.sh` invokes julia
# that way rather than through `Pkg.test`. That was true of the LOCAL runner and is still true.
# 🔴 IT STOPPED BEING TRUE OF CI. The old note ended "Nothing in this tree calls it (checked). A
# clean-room CI must either provision the global env or restore these entries." CI is now
# `julia-actions/julia-runtest@v1`, which IS `Pkg.test`: it builds an ISOLATED env where ONLY the
# [extras] named in [targets] resolve — @stdlib included, so even Printf and Random must be listed.
# MEASURED 2026-09-28, CI run #175: `ArgumentError: Package Printf not found in current path` at
# test/runtests.jl:34, while the same suite was green locally (8220 tests, exit 0). Local green and
# CI red were the SAME code under two different LOAD_PATHs — not a flake.
# Printf arrives indirectly: runtests.jl:4783 -> test_port_inventory.jl:38 -> tools/port_inventory.jl.
# JET is included unguarded at runtests.jl:4870; Aqua is try/catch-guarded (_HAS_AQUA) and so is NOT
# declared — a guarded optional import is the one kind that may stay undeclared.
[extras]
JET = "c3a54625-cd67-489e-a8e7-0a5a0ff4e31b"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
PropCheck = "ca382230-33be-11e9-0059-d981d03070e4"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
SHA = "ea8e919c-243c-51af-8825-aaa63cd721ce"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"
Zlib_jll = "83775a58-1f1d-513f-b197-d71354ab007a"

[targets]
test = ["JET", "Printf", "Random", "Test"]
