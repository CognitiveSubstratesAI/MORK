name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # 🔴 CI CANNOT BUILD THE DIFFERENTIAL ORACLE, AND MUST SAY SO RATHER THAN PRETEND.
    # Two suites compare our port against the upstream RUST binary — `upstream_conformance.jl`
    # (277 probes) and `pure_ops_differential.jl` (2711 points over 355 ops). Both are FAIL-CLOSED
    # by design: `upstream_conformance.jl`'s header says the absence "must be LOUD", because a
    # tree with no binary once "ran this file to completion, printed one @info, and reported GREEN
    # — with ZERO differential coverage".
    #
    # This runner has no Rust toolchain and no `~/JuliaAGI/dev-zone` checkout, so the oracle is
    # genuinely unavailable here — which is exactly the case the escape hatch was written for
    # ("for environments that genuinely cannot build Rust"). Setting it DELIBERATELY is the whole
    # contract: an UNSET variable must never buy silence ([[feedback_guarantee_not_convention]]).
    #
    # ⚠️ WHAT THIS COSTS: CI green means "the Julia port is self-consistent", NOT "it matches
    # upstream". The differential runs only on a dev tree that has the binary, where it is full
    # strength (2707/2711 agree; the 4 are one-ULP libm differences). Do not read a green badge as
    # port conformance.
    #
    # ⚠️ AND THIS FIXES A PRE-EXISTING BREAKAGE, not one introduced with the pure-op gate:
    # `upstream_conformance.jl` has been fail-closed since before it, with no opt-out set here.
    env:
      MORK_ALLOW_MISSING_ORACLE: '1'
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v4
      # MORK dev-links PathMap via a [sources] path (../PathMap). CI checks out only
      # this repo, so clone the sibling next to it before instantiation.
      - name: Clone PathMap (path [sources] dependency)
        run: git clone --depth 1 https://github.com/CognitiveSubstratesAI/PathMap.git ../PathMap
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  format:
    name: Format (Blue)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - name: Check formatting
        run: |
          julia -e 'using Pkg; Pkg.add(PackageSpec(name="JuliaFormatter", version="2.5.2"))'
          julia -e 'using JuliaFormatter; println("JuliaFormatter ", pkgversion(JuliaFormatter))'
          julia -e 'using JuliaFormatter; format(".")'
          if ! git diff --quiet; then
            echo "::error::Formatting check failed — files below are not Blue-formatted:"
            git --no-pager diff --stat
            exit 1
          fi
          echo "All files Blue-formatted."
